name: Project Raidline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_BASELINE: 40dd49b0c9c7dbd79dc64cad5e82308eae04f67f

jobs:
  changes:
    name: Detect C++ CI scope
    runs-on: ubuntu-22.04

    outputs:
      cpp: ${{ steps.scope.outputs.cpp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
            echo "No usable base SHA; running the full C++ matrix."
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          cpp=false

          for file in "${changed_files[@]}"; do
            case "$file" in
              doc/*|*.md)
                ;;
              *)
                cpp=true
                break
                ;;
            esac
          done

          echo "cpp=$cpp" >> "$GITHUB_OUTPUT"
          printf 'C++ CI required: %s\n' "$cpp"

  windows-cpp:
    name: Windows C++ build and test
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.cpp == 'true') }}
    runs-on: windows-2022

    env:
      BUILD_TYPE: Debug
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare vcpkg baseline
        shell: pwsh
        run: |
          git -C "$env:VCPKG_INSTALLATION_ROOT" cat-file -e "$env:VCPKG_BASELINE^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --depth=1 origin $env:VCPKG_BASELINE
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch vcpkg baseline $env:VCPKG_BASELINE"
            }
          }

          & (Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe") version
          if ($LASTEXITCODE -ne 0) {
            throw "The runner vcpkg executable is unavailable"
          }

      - name: Restore vcpkg cache
        uses: actions/cache@v5
        with:
          path: |
            build/vcpkg_installed
            .vcpkg-downloads
          key: raidline-vcpkg-v2-${{ runner.os }}-x64-windows-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            raidline-vcpkg-${{ runner.os }}-x64-windows-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure CMake
        shell: pwsh
        run: |
          $vsDevShell = Join-Path ${env:ProgramFiles} 'Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1'
          & $vsDevShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build C++ targets
        shell: pwsh
        run: |
          $vsDevShell = Join-Path ${env:ProgramFiles} 'Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1'
          & $vsDevShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --build build --parallel

      - name: Run C++ tests
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\build\vcpkg_installed\x64-windows\debug\bin;$env:PATH"
          ctest --test-dir build --output-on-failure --parallel 4

  ubuntu-cpp:
    name: Ubuntu C++ build and test
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.cpp == 'true') }}
    runs-on: ubuntu-22.04

    env:
      BUILD_TYPE: Debug
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install SDL3 system dependencies
        shell: bash
        run: bash ci/install_ubuntu_sdl3_deps.sh

      - name: Prepare vcpkg baseline
        shell: bash
        run: |
          if ! git -C "$VCPKG_INSTALLATION_ROOT" cat-file -e "${VCPKG_BASELINE}^{commit}" 2>/dev/null; then
            git -C "$VCPKG_INSTALLATION_ROOT" fetch --depth=1 origin "$VCPKG_BASELINE"
          fi

          "$VCPKG_INSTALLATION_ROOT/vcpkg" version

      - name: Restore vcpkg cache
        uses: actions/cache@v5
        with:
          path: |
            vcpkg_installed
            .vcpkg-downloads
          key: raidline-vcpkg-v2-${{ runner.os }}-x64-linux-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            raidline-vcpkg-${{ runner.os }}-x64-linux-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg packages
        shell: bash
        run: |
          mkdir -p ci-logs
          set +e

          "$VCPKG_INSTALLATION_ROOT/vcpkg" install \
            --triplet x64-linux \
            --clean-after-build \
            > ci-logs/vcpkg-install.log 2>&1

          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::vcpkg install failed with exit code $rc"
            echo "----- last 120 lines of ci-logs/vcpkg-install.log -----"
            tail -n 120 ci-logs/vcpkg-install.log
            exit $rc
          fi

      - name: Configure CMake
        shell: bash
        run: |
          mkdir -p ci-logs
          set +e

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DVCPKG_INSTALLED_DIR="$PWD/vcpkg_installed" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            > ci-logs/cmake-configure.log 2>&1

          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::CMake configure failed with exit code $rc"
            echo "----- last 120 lines of ci-logs/cmake-configure.log -----"
            tail -n 120 ci-logs/cmake-configure.log
            exit $rc
          fi

      - name: Build C++ targets
        shell: bash
        run: cmake --build build --parallel

      - name: Run C++ tests
        shell: bash
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Collect diagnostic logs
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs

          if [ -d "$VCPKG_INSTALLATION_ROOT/buildtrees" ]; then
            find "$VCPKG_INSTALLATION_ROOT/buildtrees" \
              \( -name "*-err.log" -o -name "stdout-*.log" \) \
              -type f -size +0 \
              -exec cp --parents {} ci-logs/ \; 2>/dev/null || true
          fi

          echo "----- collected log files -----"
          find ci-logs -type f | sort | sed -n '1,120p'

          echo "----- largest collected logs -----"
          du -ah ci-logs | sort -h | tail -n 30

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-ci-logs
          path: ci-logs
          if-no-files-found: ignore
